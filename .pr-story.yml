version: 1
title: "Post line/range comments straight to a real GitHub PR"
base: origin/main
head: HEAD
github:
  pr: 2
steps:
  - name: "Resolve a GitHub token without asking for a new one"
    description: |
      The one hard requirement going in: no new token to create. Most
      developers already have GitHub auth set up one way or another - the
      GitHub CLI, a cached git credential, or an env var CI already sets -
      so we try those, in order, before ever telling someone to go create
      a Personal Access Token.
    files:
      - src/github-auth.mjs
    story:
      - type: text
        content: |
          First rung: ask the GitHub CLI directly. If `gh auth login` was
          ever run, this just works, no prompt.
      - type: diff
        ref: src/github-auth.mjs#L3-L16
        caption: "gh auth token - the fast path most developers already have."
      - type: text
        content: |
          Second rung: git's own credential store. This also transparently
          picks up `gh`'s git credential helper if that's how someone
          authenticated, so it's not just a fallback for HTTPS PATs.
      - type: diff
        ref: src/github-auth.mjs#L18-L35
        caption: "git credential fill - reads what git already has cached."
      - type: diff
        ref: src/github-auth.mjs#L43-L49
        caption: "The whole ladder: gh, then git credentials, then env vars, then nothing."

  - name: "Wire a github.pr target into the CLI"
    description: |
      Commenting needs to know *which* PR to post to. owner/repo shouldn't
      be typed twice when the git remote already has them - only the PR
      number is real, unrecoverable configuration, so that's the only
      thing that goes in the story file.
    files:
      - src/story-schema.json
      - src/git.mjs
      - src/cli.mjs
      - src/github-api.mjs
    story:
      - type: text
        content: |
          The schema gained one optional field: `github: { pr }`. Nothing
          else - `owner`/`repo` come from git, not from here.
      - type: diff
        ref: src/story-schema.json#L27-L39
        caption: "The only new schema field this feature needed."
      - type: text
        content: |
          owner/repo are parsed straight out of the `origin` remote URL,
          https or ssh, so they can never drift from the actual repo.
      - type: diff
        ref: src/git.mjs#L48-L63
        caption: "Deriving owner/repo instead of asking for them again."
      - type: text
        content: |
          Putting it together: no `github.pr` set, no github.com remote
          found, or no token resolved each disable the feature with a
          specific reason - never a crash, never a silent no-op.
      - type: diff
        ref: src/cli.mjs#L90-L110
        caption: "Every reason commenting can be unavailable, surfaced to the UI."
      - type: text
        content: |
          The actual GitHub calls are a small `fetch` wrapper - no octokit
          dependency, keeps the zero-dependency CLI bundle zero-dependency.
          The API base is overridable, which doubles as GitHub Enterprise
          Server support (and is what made this testable against a local
          stub).
      - type: diff
        ref: src/github-api.mjs#L1-L29
        caption: "getPullRequest + createReviewComment, plain fetch."

  - name: "Serve /api/comment locally, without ever exposing the token"
    description: |
      The token can never reach the browser - only the local Express
      server (already running for `prstory tell`) holds it, and only it
      talks to GitHub. Since this server can now write to a real GitHub PR
      using whatever credentials it found on the machine, it also needed
      to stop listening on every network interface.
    files:
      - src/server.mjs
    story:
      - type: text
        content: |
          `/api/github-status` tells the UI whether commenting is on and
          why, but strips the token out of the response before sending it.
      - type: diff
        ref: src/server.mjs#L28-L35
        caption: "Status for the UI, token withheld."
      - type: text
        content: |
          `/api/comment` fetches the PR's current head sha (so the comment
          always anchors to the real tip, not a stale local guess), then
          posts the review comment - a single-line payload, or a range
          when `startLine` differs from `line`.
      - type: diff
        ref: src/server.mjs#L37-L65
        caption: "The only place the token is ever used."
      - type: diff
        ref: src/server.mjs#L85-L90
        caption: "127.0.0.1 only, now that this server can write to GitHub."

  - name: "Select a line or range in the UI and post it to GitHub"
    description: |
      The reviewing half of the loop: click a line in any resolved diff,
      shift-click to extend a range, write the comment, and it lands on
      that exact spot on the real pull request - the same experience as
      commenting directly in GitHub's own diff view.
    files:
      - web/src/components/DiffBlock.jsx
    story:
      - type: text
        content: |
          Only lines that are part of an actual resolved diff are
          commentable - a reference that fell back to unchanged context
          has nothing GitHub would accept a position for.
      - type: diff
        ref: web/src/components/DiffBlock.jsx#L102-L114
        caption: "Gating on a real diff, and flattening hunks into a selectable list."
      - type: text
        content: |
          A click selects one line; shift-click extends the range - but
          only within the same side (LEFT/RIGHT), since that's what
          GitHub's own multi-line comment API expects.
      - type: diff
        ref: web/src/components/DiffBlock.jsx#L116-L129
        caption: "Same-side range selection by clicking line rows."
      - type: text
        content: |
          Submitting builds exactly the shape `/api/comment` expects from
          whichever lines are selected, range or not.
      - type: diff
        ref: web/src/components/DiffBlock.jsx#L131-L152
        caption: "From a UI selection to a comment payload."
