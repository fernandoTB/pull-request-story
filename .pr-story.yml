version: 1
title: "Fail validation when the story doesn't account for the whole diff"
base: origin/main
head: HEAD
github:
  pr: 3
steps:
  - name: "Check that every changed line is referenced by some step"
    description: |
      Referencing individual lines is only half the guarantee - nothing
      stopped a step from being forgotten entirely, or a file's leftover
      changes from just never being mentioned. `prstory validate --coverage`
      diffs the real base...head and fails if any added/removed line falls
      outside every step's `diff` ref, so a coding agent (or a human) has a
      concrete, automatable signal that something either needs a step or
      needs to be cleaned up before the PR is done.
    files:
      - src/git.mjs
      - src/resolver.mjs
      - src/cli.mjs
    story:
      - type: text
        content: |
          The check needs the diff for *every* file the PR touches, not
          just one at a time like the resolver already does.
      - type: diff
        ref: src/git.mjs#L40-L44
        caption: "The same three-dot diff, unfiltered by path."
      - type: text
        content: |
          Coverage is computed by re-using the resolver's own line-position
          logic: every step's refs are unioned into per-file covered
          ranges (a bare `path` ref covers the whole file), then every real
          added/removed line's position is checked against them - a
          deletion's position is interpolated the same way a trimmed hunk's
          would be, so a range's edges behave consistently either way.
      - type: diff
        ref: src/resolver.mjs#L180-L226
        caption: "Union the story's coverage, then flag every line outside it."
      - type: text
        content: |
          Wired into `validate` as an opt-in flag rather than the default,
          so plain schema validation stays fast and git-independent; the
          report groups consecutive uncovered lines into ranges instead of
          listing each one.
      - type: diff
        ref: src/cli.mjs#L54-L99
        caption: "prstory validate --coverage: report and exit non-zero."
